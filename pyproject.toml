[project]
name = "dvh-from-txt"
version = "2.25.0"
description = "Сервис отправки данных выгрузки отчетов 1С в TXT --> Postgresql"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.128.1",
    "loguru>=0.7.3",
    "polars[rtcompat]>=0.20.0",
    "pendulum>=3.2.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "tomlkit>=0.14.0",
    "uvicorn>=0.40.0",
    "watchdog>=6.0.0",
    "cryptography>=46.0.5",
]

[project.scripts]
report-exporter = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
