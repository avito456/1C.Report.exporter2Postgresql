use = true
table_name = "way__mrt_stock"
schema_name = "report"
event_time = "stock_date"
comment = "Сверка остатков и Себестоимости по Товарам в пути на КОНЕЦ ДНЯ (рассылка 1С 'СВЕРКА_DWH_ТоварыВПути')"

[[columns]]
name = "stock_date"
alias = "stock_date"
type = "date"
comment = "Период сверки"

[[columns]]
name = "wh_name"
alias = "wh_name"
type = "string"
comment = "Склад"

[[columns]]
name = "wh_guid"
alias = "wh_guid"
type = "uuid"
comment = "GUID Склада"

[[columns]]
name = "item_name"
alias = "item_name"
type = "string"
comment = "Номенклатура"

[[columns]]
name = "item_guid"
alias = "item_guid"
type = "uuid"
comment = "GUID Номенклатуры"

[[columns]]
name = "f_cost"
alias = "f_cost"
type = "string"
comment = "Формула расчета"

[[columns]]
name = "item_type"
alias = "item_type"
type = "string"
comment = "Тип товара"

[[columns]]
name = "price"
alias = "price"
type = "float64"
comment = "Цена"

[[columns]]
name = "stock_amount_way"
alias = "stock_amount_way"
type = "Int64"
comment = "Остаток на конец дня"

[[columns]]
name = "stock_cost_way_rub"
alias = "stock_cost_way_rub"
type = "float64"
comment = "Себестоимость остатка на конец дня"

[[indexes]]
use = true
name = "way_stock_date__wh_guid__item_guid__idx"
columns = ["stock_date", "wh_guid", "item_guid"]
unique = true
