use = true
table_name = "whs__mrt_stock"
schema_name = "report"
event_time = "stock_date"
comment = "Сверка остатков и себестоимости по Товарам Организаций на КОНЕЦ ДНЯ (рассылка 1С 'СВЕРКА_DWH_ТоварыОрганизаций')"

[[columns]]
name = "stock_date"
alias = "stock_date"
type = "date"
comment = "Период"

[[columns]]
name = "wh_guid"
alias = "wh_guid"
type = "uuid"
comment = "GUID Склада"

[[columns]]
name = "wh_name"
alias = "wh_name"
type = "string"
comment = "Склад"

[[columns]]
name = "item_guid"
alias = "item_guid"
type = "uuid"
comment = "GUID Номенклатуры"

[[columns]]
name = "item_name"
alias = "item_name"
type = "string"
comment = "Номенклатура"

[[columns]]
name = "f_cost"
alias = "f_cost"
type = "string"
comment = "Формула рассчета себестоимости"

[[columns]]
name = "purche_type"
alias = "purche_type"
type = "string"
comment = "Тип товара"

[[columns]]
name = "price"
alias = "price"
type = "float64"
comment = "Цена"

[[columns]]
name = "stock_amount_whs"
alias = "stock_amount_whs"
type = "float64"
comment = "Количество конечный остаток"

[[columns]]
name = "stock_cost_whs_rub"
alias = "stock_cost_whs_rub"
type = "float64"
comment = "Себестомость конечный остаток"

[[indexes]]
use = true
name = "wh_stock_date__wh_guid__item_guid__idx"
columns = ["stock_date", "wh_guid", "item_guid"]
unique = true
